<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Administración - CafeShica</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        #nc-root {
            min-height: 100vh;
        }
        #loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 1.2rem;
            color: #666;
        }
        #error-box {
            display: none;
            padding: 2rem;
            background: #fee;
            border: 2px solid #c00;
            border-radius: 8px;
            margin: 2rem;
            color: #900;
        }
        #error-box.show { display: block; }
    </style>
</head>
<body>
    <!-- ⚠️ CONTENEDOR OBLIGATORIO PARA DECAP CMS 3.x -->
    <div id="nc-root">
        <div id="loading">⏳ Cargando panel de administración...</div>
    </div>
    
    <div id="error-box">
        <h2>❌ Error al cargar el CMS</h2>
        <p id="error-msg"></p>
        <p><strong>Solución:</strong> Presiona <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd> (o <kbd>Cmd</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd> en Mac) para forzar la recarga sin caché.</p>
    </div>

    <script>
        // Función para mostrar errores
        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-box').classList.add('show');
            document.getElementById('error-msg').textContent = msg;
        }

        // Verificar que el contenedor existe
        window.addEventListener('DOMContentLoaded', function() {
            const root = document.getElementById('nc-root');
            if (!root) {
                showError('No se encontró el contenedor #nc-root');
                return;
            }
            console.log('✅ Contenedor #nc-root encontrado');
        });

        // Manejar errores de carga
        window.addEventListener('error', function(e) {
            console.error('Error:', e.error);
            if (e.error && e.error.message && e.error.message.includes('appendChild')) {
                showError('Error de montaje del CMS. Fuerza la recarga con Ctrl+Shift+R');
            }
        });
    </script>
    
    <!-- Script de Decap CMS con versión específica -->
    <script src="https://unpkg.com/decap-cms@3.1.5/dist/decap-cms.js"></script>
</body>
</html>
