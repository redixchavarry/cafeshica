backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "configuracion"
    label: "Configuracion General"
    files:
      - name: "site"
        label: "Datos del Sitio"
        file: "data.json"
        description: "Edita los datos generales de tu pagina"
        fields:
          - label: "Informacion del Sitio"
            name: "site"
            widget: "object"
            fields:
              - label: "Titulo"
                name: "title"
                widget: "string"
                default: "CafeShica"
              - label: "Eslogan Hero"
                name: "tagline"
                widget: "text"
              - label: "Numero WhatsApp"
                name: "whatsapp"
                widget: "string"
              - label: "Email de contacto"
                name: "email"
                widget: "string"
          
          - label: "Seccion Nosotros"
            name: "about"
            widget: "object"
            fields:
              - label: "Titulo"
                name: "title"
                widget: "string"
              - label: "Imagen"
                name: "image"
                widget: "image"
              - label: "Parrafo 1"
                name: "paragraph1"
                widget: "text"
              - label: "Parrafo 2"
                name: "paragraph2"
                widget: "text"
          
          - label: "Productos"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} - {{fields.price}}"
            fields:
              - label: "Nombre del producto"
                name: "name"
                widget: "string"
              - label: "Descripcion"
                name: "description"
                widget: "text"
              - label: "Precio"
                name: "price"
                widget: "string"
              - label: "Imagen del producto"
                name: "image"
                widget: "image"
